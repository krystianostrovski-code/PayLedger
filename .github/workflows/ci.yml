name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/PayLedger.slnx

      - name: Build solution
        run: dotnet build backend/PayLedger.slnx --no-restore -c Release

      - name: Execute xUnit Unit Tests
        run: dotnet test backend/PayLedger.slnx --no-build -c Release --verbosity normal

  frontend-build:
    name: Frontend Build & Typecheck (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript typecheck & Vite production build
        run: |
          cd frontend
          npm run build
